plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarmemotoboy'
version = '1.0.0'

android {
  namespace "expo.modules.alarmemotoboy"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Mesmo arranjo do app-loja: no SDK 57 o expo-notifications vem
  // pré-compilado (artefato Maven), o repositório local dele já é ligado.
  // A versão TEM que ser a mesma do expo-notifications instalado no app
  // (package-lock) — senão o Gradle não acha o artefato e o build falha.
  implementation 'host.exp.exponent:expo.modules.notifications:57.0.22'
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core:1.17.0'
}
