plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.thermalprinterloja'
version = '1.0.0'

android {
  namespace "expo.modules.thermalprinterloja"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  maven { url 'https://jitpack.io' }
}

dependencies {
  // Serviço de push que herda do expo-notifications (alarme de pedido novo).
  // No SDK 57 o expo-notifications vem pré-compilado (artefato Maven, não
  // projeto Gradle) — o repositório local dele já é ligado a todos os projetos.
  implementation 'host.exp.exponent:expo.modules.notifications:57.0.24'
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core:1.17.0'

  // Mesma lib Android que o pacote expo-thermal-printer 0.1.1 usa por baixo
  // (com.dantsu.escposprinter) — madura, mantida, usada em produção por
  // vários apps de PDV. O que a gente escreve aqui em cima é só a parte que
  // faltava nesse pacote: listar impressoras pareadas de verdade (não só
  // "a primeira") e largura/dpi configurável (não fixo em 48mm/203dpi).
  implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.4.0'
}
